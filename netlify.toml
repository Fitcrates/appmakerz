[build]
  command = "npm run build:next"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://appcrates.netlify.app/*"
  to = "https://appcrates.pl/:splat"
  status = 301
  force = true

# IMPORTANT: everything in this file's [[headers]] blocks applies ONLY to files
# Netlify serves from its own backing store. URLs handled by a function — which
# is every HTML page, /sitemap.xml and /robots.txt — ignore them entirely.
# Verified on production: /favicon.ico came back with X-Frame-Options while /
# did not. Security headers for pages therefore live in next.config.ts
# headers(), and page cache TTL is driven by each route's `export const
# revalidate`, which is what the Next.js runtime feeds into Netlify's durable
# cache (measured: /pl/faq with revalidate = 86400 reported ttl≈60000).
#
# Freshness does not depend on those TTLs: the Sanity webhook hits
# /api/revalidate, which purges by tag and by path on every content change.

# The Next.js server function runs in the project-level functions region,
# US East (Ohio, `cmh`) by default — roughly 120 ms RTT from Poland before the
# render even starts. Moving it to Frankfurt (`fra`) requires a Pro plan and
# must be set in the Netlify UI under Project configuration > Build & deploy >
# Continuous deployment > Functions region. A [functions] region key here does
# not reach framework-generated functions, so it is intentionally not set.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static file in public/, so this one does take effect.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Keep the custom AI edge function on Netlify while the site itself runs on Next.js.
[[edge_functions]]
  path = "/api/ai-generate"
  function = "ai-generate"

[[plugins]]
  package = "@netlify/plugin-nextjs"
